<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Completing ArcGIS sign-in…</title>
  <script src="https://js.arcgis.com/4.30/"></script>
  <script>
    require(["esri/identity/IdentityManager"], function (esriId) {
      esriId.setOAuthResponseHash(window.location.hash);

      // Redirect back to the PWA rather than depending on a popup window.
      window.setTimeout(function () {
        window.location.replace("./");
      }, 250);
    });
  </script>
</head>
<body>
  Completing ArcGIS sign-in…
</body>
</html>
